name: Vérification du projet

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier la syntaxe Python
        run: python -m py_compile scripts/update_veille.py scripts/collect_community.py scripts/synthesize_community.py scripts/skip_timestamp_only_changes.py tests/test_update_veille.py tests/test_collect_community.py tests/test_synthesize_community.py tests/test_skip_timestamp_only_changes.py
      - name: Exécuter les tests du collecteur
        run: python -m unittest discover -s tests -v
      - name: Vérifier les JSON initiaux
        run: |
          python -m json.tool data/veille.json > /dev/null
          python -m json.tool data/community.json > /dev/null
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check app.js
          node --check tests/e2e.js
      - name: Installer Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Installer Chromium pour les tests navigateur
        run: npx playwright install --with-deps chromium
      - name: Tester le site dans Chromium
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/automatik-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/e2e.js
      - name: Vérifier les fichiers essentiels
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s scripts/update_veille.py
          test -s scripts/collect_community.py
          test -s scripts/synthesize_community.py
          test -s data/community.json
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
