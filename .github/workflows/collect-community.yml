name: Collecte Fortinet Community

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/collect_community.py"
      - "scripts/synthesize_community.py"
      - "scripts/update_veille.py"
      - "tests/test_synthesize_community.py"
      - "tests/test_collect_community.py"
      - ".github/workflows/collect-community.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-fortinet-community
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester la collecte et la synthèse
        run: python -m unittest discover -s tests -v
      - name: Collecter les sujets du forum
        run: python scripts/collect_community.py
      - name: Regrouper les problèmes similaires et synthétiser
        run: python scripts/synthesize_community.py
      - name: Valider le JSON
        run: python -m json.tool data/community.json > /dev/null
      - name: Enregistrer les nouvelles données sur main
        run: |
          if git diff --quiet -- data/community.json; then
            echo "Aucune modification de la veille Community."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community.json
          git commit -m "chore: actualiser la veille Fortinet Community"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push concurrent refusé, tentative $attempt/3."
          done
          exit 1
